<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VigPass Seite nicht gefunden</title>
<!-- Copyright © 2026 Kreshnik Berisha · VigPass. Alle Rechte vorbehalten. -->
<script>
  // Tippvarianten zur richtigen Seite weiterleiten: /Termin, /termin/, /TERMIN.html, /vigpass-web/termin …
  // Die Termindaten nach „#“ bzw. „?“ werden mitgenommen.
  (function () {
    var p = location.pathname.toLowerCase().replace(/\/+$/, '').replace(/^\/vigpass-web/, '');
    var to = /(^|\/)termin(\.html?)?$/.test(p) ? '/termin' : (p === '' || /^\/(index(\.html?)?|start|home)$/.test(p)) ? '/' : null;
    if (to) location.replace(to + location.search + location.hash);
  })();
</script>
<style>
  :root { --bg: #eef2f7; --card: #ffffff; --ink: #0f1b2d; --muted: #5b6b80; --line: #d6dee8; --blue: #6cc4f5; --red: #b00e26; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #0b1420; --card: #152234; --ink: #eaf1fa; --muted: #9db0c6; --line: #2a3b52; }
  }
  :root[data-theme="dark"] { --bg: #0b1420; --card: #152234; --ink: #eaf1fa; --muted: #9db0c6; --line: #2a3b52; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 560px; margin: 0 auto; padding: 40px 16px; text-align: center; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 24px 18px; }
  .logo { width: 56px; height: 56px; border-radius: 14px; background: #ffc400; display: inline-grid; place-items: center; font-size: 30px; }
  h1 { font-size: 22px; margin: 14px 0 6px; }
  p { color: var(--muted); }
  .btns { display: grid; gap: 10px; margin-top: 16px; }
  .btn { display: flex; align-items: center; justify-content: center; min-height: 50px; border-radius: 14px; font-weight: 800; text-decoration: none; border: 1.5px solid var(--line); color: var(--ink); }
  .main { background: var(--blue); color: var(--red); border-color: var(--blue); }
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="logo" aria-hidden="true">✅</div>
    <h1>Diese Seite gibt es leider nicht</h1>
    <p>Vielleicht hat sich in der Adresse ein Tippfehler eingeschlichen.</p>
    <div class="btns">
      <a class="btn main" href="/">Zur Startseite von VigPass</a>
      <a class="btn" href="/termin">Werkstatt-Termin erstellen</a>
    </div>
  </div>
</main>
</body>
</html>
